      <text x="1200" y="60" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" letter-spacing="-1">
        <tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#4285F4">g</tspan><tspan fill="#34A853">l</tspan><tspan fill="#EA4335">e</tspan>
      </text>

      <text x="1418" y="52" font-family="sans-serif" font-size="20" fill="#cccccc">•</text>

      <!-- PwC -->
      <g transform="translate(1455, 10)">
        <polygon points="24,0 48,0 39,13 15,13" fill="#E05C00"/>
        <polygon points="15,0 24,0 15,13 6,13"  fill="#E05C00"/>
        <text x="0" y="62" font-family="Georgia,'Times New Roman',serif" font-size="32" font-weight="700" fill="#1a1a1a">pwc</text>
      </g>

      <text x="1668" y="52" font-family="sans-serif" font-size="20" fill="#cccccc">•</text>

      <!-- CMU -->
      <text x="1700" y="36" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="700" fill="#C41230">Carnegie</text>
      <text x="1700" y="54" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="700" fill="#C41230">Mellon</text>
      <text x="1700" y="72" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="700" fill="#C41230">University</text>

    </g>
